name: DR Restore Rehearsal

on:
  push:
    branches: [freeze-prep]
    paths:
      - 'supabase/restore/**'
      - 'supabase/functions/**'
      - '.github/workflows/dr-restore-rehearsal.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/b3-**'
      - '.github/workflows/dr-restore-rehearsal.yml'

jobs:
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start isolated local Supabase foundation without app migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rohmat-repo-migrations
          if compgen -G 'supabase/migrations/*.sql' >/dev/null; then
            mv supabase/migrations/*.sql /tmp/rohmat-repo-migrations/
          fi
          supabase start

      - name: Apply production pre-migration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          while IFS= read -r f; do
            echo "Applying prerequisite $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done < <(find supabase/restore/bootstrap -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Replay sanitized canonical production migration history
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          test -f supabase/restore/manifest.json
          COUNT="$(node -p "JSON.parse(require('fs').readFileSync('supabase/restore/manifest.json','utf8')).count")"
          EXPECTED_HEAD="$(node -p "const m=JSON.parse(require('fs').readFileSync('supabase/restore/manifest.json','utf8')).migrations; m[m.length-1].version")"
          test "$COUNT" -ge 166
          APPLIED=0
          INTERSTITIAL=0
          while IFS= read -r f; do
            echo "Applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" >/tmp/rohmat-dr-psql.log 2>&1 || { cat /tmp/rohmat-dr-psql.log; exit 1; }
            case "$f" in
              */history/*)
                APPLIED=$((APPLIED+1))
                base="$(basename "$f" .sql)"
                version="${base%%_*}"
                name="${base#*_}"
                [[ "$version" =~ ^[0-9]{14}$ ]]
                [[ "$name" =~ ^[a-z0-9_]+$ ]]
                psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name,statements) values ('$version','$name',array[]::text[]) on conflict(version) do update set name=excluded.name" >/dev/null
                ;;
              */interstitial/*) INTERSTITIAL=$((INTERSTITIAL+1)) ;;
              *) echo "Unexpected replay path: $f"; exit 1 ;;
            esac
          done < <(find supabase/restore/history supabase/restore/interstitial -maxdepth 1 -type f -name '*.sql' -printf '%f\t%p\n' | sort -k1,1 | cut -f2-)
          test "$APPLIED" -eq "$COUNT"
          test "$INTERSTITIAL" -ge 1
          LEDGER_COUNT="$(psql "$DB_URL" -Atc "select count(*) from supabase_migrations.schema_migrations")"
          ACTUAL_HEAD="$(psql "$DB_URL" -Atc "select max(version) from supabase_migrations.schema_migrations")"
          test "$LEDGER_COUNT" -eq "$COUNT"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          while IFS= read -r f; do
            echo "Applying cleanup $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done < <(find supabase/restore/post-export -maxdepth 1 -type f -name '*.sql' | sort)
          echo "Replayed $APPLIED sanitized production migrations, $INTERSTITIAL explicit untracked prerequisites, plus cleanup."

      - name: Replay canonical post-export source tail
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          apply_sql(){
            local f="$1"
            echo "Applying canonical tail $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" >/tmp/rohmat-dr-tail.log 2>&1 || { cat /tmp/rohmat-dr-tail.log; exit 1; }
          }
          ledger(){
            local version="$1" name="$2"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name,statements) values ('$version','$name',array[]::text[]) on conflict(version) do update set name=excluded.name" >/dev/null
          }

          # These migrations existed in the canonical source/runtime but were not part of
          # the 2026-09-13 sanitized ledger export. Treat them as explicit interstitial
          # source tail, preserving the sanitized migration ledger.
          while IFS= read -r f; do
            if [ "$(basename "$f")" = "20260918192858_smart_digital_indonesia_platform_foundation_v1.sql" ]; then
              apply_sql "supabase/restore/tail-bridges/20260918192850_platform_identity_seed_bridge.sql"
            fi
            apply_sql "$f"
          done < <(
            find /tmp/rohmat-repo-migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\t%p\n' |
            awk -F '\t' '$1 ~ /^202609(14|15|17|18|19|20)/ {print $0}' |
            sort -k1,1 | cut -f2-
          )

          # Batch 5 is tracked in the production ledger.
          for spec in \
            "20260926070025 batch5_explicit_deny_rls_policies" \
            "20260926071510 batch5_add_missing_kds_dismissed_at" \
            "20260926082641 batch5_revoke_anon_origin_resolver" \
            "20260926083435 batch5_restore_anon_origin_resolver_until_cutover" \
            "20260926084339 batch5_sheet_worker_production_routing" \
            "20260926123347 batch5_finalize_origin_resolver_service_only"
          do
            version="${spec%% *}"; name="${spec#* }"
            f="/tmp/rohmat-repo-migrations/${version}_${name}.sql"
            test -f "$f"
            apply_sql "$f"
            ledger "$version" "$name"
          done

          # The Sep-18 Admin recovery migration intentionally reintroduced the legacy
          # URL lock. Production later removed all three per-domain locks before B1.
          # Reapply the explicit recovery bridge at the chronologically correct point.
          apply_sql "supabase/restore/interstitial/20260927180000_b1_canonical_url_constraint_bridge.sql"

          # B1 canonical-domain work is intentionally source-tail/interstitial in the
          # production ledger; it must still be present in a recoverable schema.
          for f in \
            /tmp/rohmat-repo-migrations/20260927183000_smart_order_b1_canonical_identity_v1.sql \
            /tmp/rohmat-repo-migrations/20260927191000_smart_order_b1_release_pin_v1.sql \
            /tmp/rohmat-repo-migrations/20260927192000_smart_order_b1_final_pin_v1.sql \
            /tmp/rohmat-repo-migrations/20260927193000_smart_order_b1_unified_origin_resolver_v1.sql
          do
            test -f "$f"
            apply_sql "$f"
          done

          # Reconstruct the untracked B1 alias cleanup before B2 enforces one canonical alias.
          apply_sql "supabase/restore/tail-bridges/20260927193500_single_canonical_alias_bridge.sql"

          # Production had a KDS realtime contract before B2, but its creation was
          # not represented in the canonical migration ledger. Reconstruct it explicitly.
          apply_sql "supabase/restore/tail-bridges/20260927194000_kds_realtime_contract_bridge.sql"

          # B2 source timestamps differ from their production migration ledger versions
          # because they were applied through the migration API. Preserve the real ledger.
          while IFS='|' read -r src version name; do
            test -n "$src"
            f="/tmp/rohmat-repo-migrations/$src"
            test -f "$f"
            apply_sql "$f"
            ledger "$version" "$name"
          done <<'EOF'
          20260927194500_smart_order_b2_runtime_security_foundation_v1.sql|20260927122856|smart_order_b2_runtime_security_foundation_v1
          20260927203000_smart_order_b2_final_security_cutover_v1.sql|20260927123415|smart_order_b2_final_security_cutover_v1
          20260927204500_smart_order_b2_evidence_pin_v1.sql|20260927123915|smart_order_b2_evidence_pin_v1
          20260927212000_smart_order_b3_integrated_observability_v1.sql|20260927135426|smart_order_b3_integrated_observability_v1
          EOF

          apply_sql "supabase/restore/tail-bridges/20260927204600_live_identity_reconcile_bridge.sql"
          apply_sql "supabase/restore/tail-bridges/20260927204700_retired_rdc_recovery_cleanup.sql"

          # B3 final evidence seal is data/control-plane only and intentionally replayable.
          FINAL_SEAL="/tmp/rohmat-repo-migrations/20260927144325_smart_order_b3_final_evidence_seal_v1.sql"
          test -f "$FINAL_SEAL"
          apply_sql "$FINAL_SEAL"
          ledger "20260927144325" "smart_order_b3_final_evidence_seal_v1"

          # B4 clone foundation must itself be recoverable before promotion is allowed.
          B4_CLONE="/tmp/rohmat-repo-migrations/20260927160000_smart_order_b4_clone_foundation_v1.sql"
          test -f "$B4_CLONE"
          apply_sql "$B4_CLONE"
          ledger "20260927160000" "smart_order_b4_clone_foundation_v1"

          # B4.2 persists immutable certification evidence and must also replay cleanly.
          B4_CERT="/tmp/rohmat-repo-migrations/20260927172500_smart_order_b4_clone_certification_v1.sql"
          test -f "$B4_CERT"
          apply_sql "$B4_CERT"
          ledger "20260927172500" "smart_order_b4_clone_certification_v1"

          # B4.3 installs immutable guards + one-shot promotion finalizer.
          B4_FINAL="/tmp/rohmat-repo-migrations/20260927174000_smart_order_b4_final_master_freeze_v1.sql"
          test -f "$B4_FINAL"
          apply_sql "$B4_FINAL"
          ledger "20260927174000" "smart_order_b4_final_master_freeze_v1"

          COUNT="$(node -p "JSON.parse(require('fs').readFileSync('supabase/restore/manifest.json','utf8')).count")"
          LEDGER_COUNT="$(psql "$DB_URL" -Atc "select count(*) from supabase_migrations.schema_migrations")"
          ACTUAL_HEAD="$(psql "$DB_URL" -Atc "select max(version) from supabase_migrations.schema_migrations")"
          test "$LEDGER_COUNT" -eq "$((COUNT+14))"
          test "$ACTUAL_HEAD" = '20260927174000'
          echo "B4_DR_FINAL_PROMOTION_FOUNDATION_PASS=1"

      - name: Verify production structural contract
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          sql(){ psql "$DB_URL" -Atc "$1"; }
          echo "public_tables=$(sql "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r'")"
          echo "private_tables=$(sql "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='private' and c.relkind='r'")"
          echo "public_views=$(sql "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='v'")"
          echo "public_functions=$(sql "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where p.prokind='f' and n.nspname='public'")"
          echo "private_functions=$(sql "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where p.prokind='f' and n.nspname='private'")"
          echo "rls_tables=$(sql "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','private') and c.relkind='r' and c.relrowsecurity")"
          echo "policies=$(sql "select count(*) from pg_policies where schemaname in ('public','private')")"
          echo "triggers=$(sql "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','private') and not t.tgisinternal")"
          echo "indexes=$(sql "select count(*) from pg_indexes where schemaname in ('public','private')")"
          echo "runtime_health_fn=$(sql "select to_regprocedure('public.master_runtime_security_health_v1(uuid)') is not null")"
          echo "runtime_context_fn=$(sql "select to_regprocedure('public.master_prototype_runtime_context(uuid,text,text)') is not null")"
          echo "platform_prototypes=$(sql "select to_regclass('private.platform_prototypes') is not null")"
          echo "tenant_runtime_config=$(sql "select to_regclass('private.tenant_runtime_config') is not null")"
          echo "kds_realtime_ticket=$(sql "select to_regprocedure('public.kds_realtime_ticket_tenant(uuid,text)') is not null")"
          echo "kds_realtime_broadcast=$(sql "select to_regprocedure('private.kds_realtime_broadcast()') is not null")"
          echo "kds_realtime_rls=$(sql "select relrowsecurity from pg_class where oid='private.kds_realtime_channels'::regclass")"
          echo "anon_internal_rpc_usage=$(sql "select has_schema_privilege('anon','internal_rpc','USAGE')")"
          echo "release_engineering_status=$(sql "select private.release_engineering_status()")"
          test "$(sql "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r'")" = '19'
          test "$(sql "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='private' and c.relkind='r'")" = '52'
          test "$(sql "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='v'")" = '2'
          test "$(sql "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where p.prokind='f' and n.nspname='public'")" = '114'
          test "$(sql "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where p.prokind='f' and n.nspname='private'")" = '98'
          test "$(sql "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','private') and c.relkind='r' and c.relrowsecurity")" = '71'
          test "$(sql "select count(*) from pg_policies where schemaname in ('public','private')")" = '81'
          test "$(sql "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','private') and not t.tgisinternal")" = '44'
          test "$(sql "select count(*) from pg_indexes where schemaname in ('public','private')")" = '159'
          test "$(sql "select to_regprocedure('public.master_runtime_security_health_v1(uuid)') is not null")" = 't'
          test "$(sql "select to_regprocedure('public.master_prototype_runtime_context(uuid,text,text)') is not null")" = 't'
          test "$(sql "select to_regclass('private.platform_prototypes') is not null")" = 't'
          test "$(sql "select to_regclass('private.tenant_runtime_config') is not null")" = 't'
          test "$(sql "select relrowsecurity from pg_class where oid='private.kds_realtime_channels'::regclass")" = 't'
          test "$(sql "select has_schema_privilege('anon','internal_rpc','USAGE')")" = 'f'
          test "$(sql "select (private.release_engineering_status()->>'ok')::boolean")" = 't'

      - name: Run disposable B4 tenant clone rehearsal
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/b4-clone-rehearsal.sql | tee /tmp/b4-clone-rehearsal.log
          grep -q '"ok": true' /tmp/b4-clone-rehearsal.log || grep -q '"ok" : true' /tmp/b4-clone-rehearsal.log || grep -q '"ok":true' /tmp/b4-clone-rehearsal.log
          grep -q '"tenant_residue" : 0' /tmp/b4-clone-rehearsal.log || grep -q '"tenant_residue": 0' /tmp/b4-clone-rehearsal.log || grep -q '"tenant_residue":0' /tmp/b4-clone-rehearsal.log
          grep -q '"origin_residue" : 0' /tmp/b4-clone-rehearsal.log || grep -q '"origin_residue": 0' /tmp/b4-clone-rehearsal.log || grep -q '"origin_residue":0' /tmp/b4-clone-rehearsal.log
          echo "B4_DISPOSABLE_CLONE_REHEARSAL_PASS=1"

      - name: Run persisted B4 clone certification
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          OUT="$(psql "$DB_URL" -Atc "select private.run_master_clone_rehearsal_v1()")"
          echo "$OUT"
          echo "$OUT" | grep -q '"ok": true' || echo "$OUT" | grep -q '"ok":true'
          test "$(psql "$DB_URL" -Atc "select count(*) from private.master_clone_rehearsal_evidence where passed and residue_zero")" -ge 1
          test "$(psql "$DB_URL" -Atc "select count(*) from private.platform_tenants where slug like 'b4-cert-%'")" = '0'
          test "$(psql "$DB_URL" -Atc "select count(*) from private.tenant_origin_aliases where origin like 'https://b4-cert-%.invalid'")" = '0'
          echo "B4_PERSISTED_CLONE_CERTIFICATION_PASS=1"

      - name: Finalize immutable master in isolated DR
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          SHA='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          TAG='smart-order-sdb-master-v1.0.0'
          OUT="$(psql "$DB_URL" -Atc "select private.finalize_master_promotion_v1('$TAG','$SHA')")"
          echo "$OUT"
          echo "$OUT" | grep -q '"ok": true' || echo "$OUT" | grep -q '"ok":true'

          POST="$(psql "$DB_URL" -Atc "select private.run_postfreeze_clone_rehearsal_v1()")"
          echo "$POST"
          echo "$POST" | grep -q '"ok": true' || echo "$POST" | grep -q '"ok":true'
          echo "$POST" | grep -q '"cleanup_residue": 0' || echo "$POST" | grep -q '"cleanup_residue":0'

          echo "new_master_status=$(psql "$DB_URL" -Atc "select status from private.platform_prototypes where prototype_key='smart-order-sdb-platform-v1'")"
          echo "old_master_status=$(psql "$DB_URL" -Atc "select status from private.platform_prototypes where prototype_key='rohmat-master-prototype-v1'")"
          echo "active_prototypes=$(psql "$DB_URL" -Atc "select count(*) from private.platform_prototypes where status='active'")"
          echo "active_templates=$(psql "$DB_URL" -Atc "select count(*) from private.platform_clone_templates where status='active' and template_key='smart-order-sdb-master-v1'")"
          echo "postfreeze_evidence=$(psql "$DB_URL" -Atc "select count(*) from private.master_clone_rehearsal_evidence where clone_contract='smart-order-b4-postfreeze-certification-v1' and passed and residue_zero")"
          echo "freeze_status=$(psql "$DB_URL" -Atc "select private.master_freeze_status_v1()")"
          test "$(psql "$DB_URL" -Atc "select status from private.platform_prototypes where prototype_key='smart-order-sdb-platform-v1'")" = 'active'
          test "$(psql "$DB_URL" -Atc "select status from private.platform_prototypes where prototype_key='rohmat-master-prototype-v1'")" = 'deprecated'
          test "$(psql "$DB_URL" -Atc "select count(*) from private.platform_prototypes where status='active'")" = '1'
          test "$(psql "$DB_URL" -Atc "select count(*) from private.platform_clone_templates where status='active' and template_key='smart-order-sdb-master-v1'")" = '1'
          test "$(psql "$DB_URL" -Atc "select count(*) from private.master_clone_rehearsal_evidence where clone_contract='smart-order-b4-postfreeze-certification-v1' and passed and residue_zero")" -ge '1'
          test "$(psql "$DB_URL" -Atc "select (private.master_freeze_status_v1()->>'postfreeze_clone_ok')::boolean")" = 't'
          test "$(psql "$DB_URL" -Atc "select (private.master_freeze_status_v1()->>'ok')::boolean")" = 't'
          test "$(psql "$DB_URL" -Atc "select count(*) from private.platform_tenants where slug like 'b4-cert-%'")" = '0'
          echo "B4_ISOLATED_MASTER_PROMOTION_PASS=1"

      - name: Verify critical restored relations and RLS
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          required=(orders menu_items site_settings site_settings_public_v2 site_settings_admin_runtime_v1 sheet_sync_outbox sheet_sync_targets order_events admin_users order_history_archive public_site_source_snapshots)
          for rel in "${required[@]}"; do
            test "$(psql "$DB_URL" -Atc "select to_regclass('public.${rel}') is not null")" = 't'
          done
          for rel in orders menu_items site_settings_public_v2 site_settings_admin_runtime_v1 sheet_sync_outbox admin_users; do
            test "$(psql "$DB_URL" -Atc "select relrowsecurity from pg_class where oid='public.${rel}'::regclass")" = 't'
          done
          test "$(psql "$DB_URL" -Atc "select to_regclass('private.sheet_writer_lease') is not null")" = 't'
          test "$(psql "$DB_URL" -Atc "select relrowsecurity from pg_class where oid='private.sheet_writer_lease'::regclass")" = 't'

      - name: Verify least-privilege and sensitive RPC contract
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          sql(){ psql "$DB_URL" -Atc "$1"; }
          test "$(sql "select has_table_privilege('anon','public.site_settings','select')")" = 'f'
          test "$(sql "select has_table_privilege('anon','public.site_settings_public_v2','select')")" = 't'
          test "$(sql "select has_table_privilege('anon','public.site_settings_admin_runtime_v1','select')")" = 't'
          test "$(sql "select has_table_privilege('anon','public.order_archive_7d','select')")" = 'f'
          test "$(sql "select has_table_privilege('authenticated','public.order_archive_7d','select')")" = 'f'
          test "$(sql "select has_function_privilege('anon','public.kds_snapshot(text)','execute')")" = 'f'
          test "$(sql "select has_function_privilege('anon','public.kds_update_order(text,uuid,text)','execute')")" = 'f'
          test "$(sql "select has_function_privilege('anon','public.sheet_writer_try_acquire_lease(uuid,integer)','execute')")" = 'f'
          test "$(sql "select has_function_privilege('authenticated','public.sheet_writer_try_acquire_lease(uuid,integer)','execute')")" = 'f'
          test "$(sql "select has_function_privilege('service_role','public.sheet_writer_try_acquire_lease(uuid,integer)','execute')")" = 't'
          test "$(sql "select has_function_privilege('anon','public.sheet_writer_release_lease(uuid)','execute')")" = 'f'
          test "$(sql "select has_function_privilege('authenticated','public.sheet_writer_release_lease(uuid)','execute')")" = 'f'
          test "$(sql "select has_function_privilege('service_role','public.sheet_writer_release_lease(uuid)','execute')")" = 't'
          test "$(sql "select to_regprocedure('public.kds_bff_login_bound(text,text,text)') is not null")" = 't'
          test "$(sql "select to_regprocedure('public.admin_console_snapshot(text)') is not null")" = 't'
          test "$(sql "select to_regprocedure('private.release_preflight_status()') is not null")" = 't'
          test "$(sql "select to_regprocedure('public.release_preflight_status()') is null")" = 't'
          test "$(sql "select to_regprocedure('public.get_sheet_sync_health()') is not null")" = 't'
          test "$(sql "select to_regprocedure('public.dr_export_migration_history_v1(integer,integer)') is null")" = 't'
          test "$(sql "select pg_get_functiondef('private.dispatch_sheet_sync_event()'::regprocedure) like '%rohmat-sheet-sync-worker-v1%'")" = 't'

      - name: Verify canonical Edge Function source is present
        run: |
          test -f supabase/functions/rohmat-kds-api/index.ts
          test -f supabase/functions/rohmat-admin-render/index.ts
          test -f supabase/functions/rohmat-secure-api-v1/index.ts
          test -f supabase/functions/rohmat-sheet-sync-worker-v1/index.ts
          test -f supabase/functions/rohmat-sheet-sync-dispatch-v1/index.ts
          test -f supabase/functions/rohmat-smart-cashier-v1/index.ts
          test -f supabase/functions/create-order/index.ts
          test -f supabase/functions/create-order-v6/index.ts

      - name: Export isolated restore fingerprint
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" pg_dump -U postgres -d postgres --schema-only --no-owner --no-privileges \
            --schema=public --schema=private \
            | sed -E '/^-- Dumped (from|by)/d;/^\\restrict /d;/^\\unrestrict /d' \
            | sha256sum | tee /tmp/dr-schema-fingerprint.txt
          test -s /tmp/dr-schema-fingerprint.txt
          test "$(cut -d' ' -f1 /tmp/dr-schema-fingerprint.txt)" != 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
          echo 'DR_RESTORE_PASS=1'

      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
