name: Batch 2 Vercel OIDC Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch2-vercel-oidc-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Diagnose Vercel OIDC exchange without exposing credentials
        shell: bash
        env:
          GH_OIDC: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o /tmp/vercel-exchange.json -w '%{http_code}' -X POST https://api.vercel.com/login/oauth/token             --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data 'client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD'             --data 'subject_token_type=urn:ietf:params:oauth:token-type:id_token'             --data 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode 'team_id_or_slug=gramatikafoundation-3204'             --data-urlencode "subject_token=$GH_OIDC")"
          echo "BATCH2_VERCEL_OIDC_EXCHANGE_HTTP=$HTTP"
          jq '{error,error_description,code,message}' /tmp/vercel-exchange.json
          test "$HTTP" = "200"
