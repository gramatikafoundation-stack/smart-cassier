name: Batch 2 Build Vercel Deployment Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch2-build-vercel-bundle.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build deployable unified source bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const files=cp.execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const wanted=files.filter(p =>
            p==='vercel.json' ||
            p==='package.json' ||
            p.startsWith('api/') ||
            (p.startsWith('apps/public/') && !p.startsWith('apps/public/tests/')) ||
            p.startsWith('apps/admin/') ||
            p.startsWith('apps/kds/') ||
            p.startsWith('apps/portal/')
          ).filter(p=>!p.endsWith('/.gitignore')&&!p.includes('/.preview-trigger')&&!p.includes('/.deploy-trigger')&&!p.includes('/.deploy-now')&&!p.includes('/.production-cutover-trigger')&&!p.includes('/.source-production-sync'));
          const payload={contract:'batch2-public-vercel-deploy-bundle-v1',source_commit:process.env.GITHUB_SHA,files:wanted.map(file=>({file,data:fs.readFileSync(file,'utf8'),encoding:'utf-8'}))};
          fs.mkdirSync('ops',{recursive:true});
          fs.writeFileSync('ops/batch2-vercel-deploy-files.json',JSON.stringify(payload));
          console.log(JSON.stringify({files:payload.files.length,bytes:Buffer.byteLength(JSON.stringify(payload)),source_commit:payload.source_commit}));
          NODE
      - name: Commit temporary deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/batch2-vercel-deploy-files.json
          git commit -m "chore: stage Batch 2 Vercel deployment bundle"
          git push origin HEAD:main
