name: Batch 2 Vercel OIDC Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch2-vercel-oidc-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Exchange short-lived identity and verify Vercel project access
        shell: bash
        env:
          GH_OIDC: ${{ steps.oidc.outputs.token }}
          VERCEL_TEAM_ID: team_ZpgMfDYGskDACkOuneXhRdPG
          VERCEL_PROJECT_ID: prj_5xph62xWBNqRRR3MZ3bgA0qZU9NK
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -f -X POST https://api.vercel.com/login/oauth/token             --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data 'client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD'             --data 'subject_token_type=urn:ietf:params:oauth:token-type:id_token'             --data 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode "team_id_or_slug=$VERCEL_TEAM_ID"             --data-urlencode "subject_token=$GH_OIDC")"
          ACCESS="$(printf '%s' "$RESPONSE" | jq -r '.access_token // empty')"
          test -n "$ACCESS"
          echo "::add-mask::$ACCESS"
          CODE="$(curl -sS -o /tmp/project.json -w '%{http_code}'             -H "Authorization: Bearer $ACCESS"             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")"
          test "$CODE" = "200"
          jq -e --arg p "$VERCEL_PROJECT_ID" '.id==$p' /tmp/project.json >/dev/null
          echo "BATCH2_VERCEL_OIDC_PROJECT_ACCESS_PASS=1"
