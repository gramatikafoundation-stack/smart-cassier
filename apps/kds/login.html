<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153f33">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Masuk KDS</title>
  <link rel="stylesheet" href="/kds-assets/v4/styles.css">
</head>
<body class="loginPage">
  <main class="loginShell">
    <section class="loginBrand" aria-labelledby="kdsBrandTitle">
      <small>AREA PRODUSEN</small>
      <h1 id="kdsBrandTitle">KDS<br><span data-tenant-business>Business</span></h1>
      <p>Login dipisahkan dari layar operasional dapur. Setelah autentikasi berhasil, Kitchen Display System dibuka.</p>
    </section>
    <section class="loginPane">
      <form id="loginForm" class="loginCard" aria-labelledby="loginTitle">
        <small>AKSES TERPROTEKSI</small>
        <h2 id="loginTitle">Masuk ke KDS</h2>
        <p class="muted" id="loginHelp">Gunakan akun pengelola dan kata sandi.</p>
        <label class="field">Email pengelola<input id="email" type="email" inputmode="email" autocomplete="username" aria-describedby="loginHelp" required></label>
        <label class="field">Kata sandi<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="loginButton" class="btn green" type="submit">Masuk ke Kitchen Display System</button>
        <p id="loginMessage" class="msg" role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
    </section>
  </main>
  <script src="/kds-assets/v4/tenant-runtime.js" defer></script>
  <script src="/kds-assets/v4/design-runtime.js" defer></script>
  <script src="/kds-assets/v4/login.js" defer></script>
</body>
</html>
