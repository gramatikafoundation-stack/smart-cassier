name: Batch 2 Vercel OIDC Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch2-vercel-oidc-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Obtain short-lived Vercel CI credentials
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: gramatikafoundation-3204
      - name: Probe whether short-lived credential can read project
        shell: bash
        env:
          VERCEL_TEAM_ID: team_ZpgMfDYGskDACkOuneXhRdPG
          VERCEL_PROJECT_ID: prj_5xph62xWBNqRRR3MZ3bgA0qZU9NK
        run: |
          set -euo pipefail
          test -n "${TURBO_TOKEN:-}"
          echo "::add-mask::$TURBO_TOKEN"
          CODE="$(curl -sS -o /tmp/project.json -w '%{http_code}'             -H "Authorization: Bearer $TURBO_TOKEN"             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")"
          echo "BATCH2_VERCEL_OIDC_PROJECT_HTTP=$CODE"
          test "$CODE" = "200"
          jq -e --arg p "$VERCEL_PROJECT_ID" '.id==$p' /tmp/project.json >/dev/null
          echo "BATCH2_VERCEL_OIDC_PROJECT_ACCESS_PASS=1"
