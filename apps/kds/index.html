<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10140f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Kitchen Display System</title>
  <link rel="stylesheet" href="/kds-assets/v4/styles.css">
  <link rel="stylesheet" href="/kds-assets/v4/cashier-gate.css">
  <link rel="stylesheet" href="/kds-assets/v4/menu-media.css">
</head>
<body class="kdsPage">
  <a class="skipLink" href="#ordersTab">Lewati ke konten utama</a>
  <div id="app" hidden>
    <header class="shell top">
      <div class="bar">
        <div class="ico" aria-hidden="true">♨</div>
        <div>
          <div class="ey">AREA PRODUSEN</div>
          <h1>Kitchen Display System</h1>
          <div class="tenantBrand" data-tenant-business>Business</div>
        </div>
        <div class="actions">
          <span id="sync" class="pill sync-booting" role="status" aria-live="polite" aria-atomic="true">● Menyiapkan sinkronisasi</span>
          <button id="refresh" class="btn green" type="button">↻ Perbarui</button>
          <button id="logout" class="btn" type="button">Keluar</button>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Bagian KDS">
        <button id="tabOrders" class="tab on" type="button" role="tab" aria-selected="true" aria-controls="ordersTab" data-tab="orders">Pesanan Dapur</button>
        <button id="tabCashier" class="tab" type="button" role="tab" aria-selected="false" aria-controls="cashierTab" data-tab="cashier">Smart Cashier</button>
        <button id="tabStock" class="tab" type="button" role="tab" aria-selected="false" aria-controls="stockTab" data-tab="stock">Ketersediaan Barang</button>
      </nav>
    </header>
    <main class="shell" id="kdsMain">
      <section id="ordersTab" role="tabpanel" aria-labelledby="tabOrders" tabindex="-1">
        <div class="stats">
          <div class="stat"><small>Pesanan Baru</small><strong id="sNew">0</strong></div>
          <div class="stat"><small>Sedang Diproses</small><strong id="sProc">0</strong></div>
          <div id="sDoneWrap" class="stat"><small>Pesanan Selesai</small><strong id="sDone">0</strong></div>
        </div>
        <div id="lanes" class="lanes"></div>
      </section>
      <section id="cashierTab" role="tabpanel" aria-labelledby="tabCashier" tabindex="-1" hidden>
        <div id="cashierRoot" class="cashierSurface"><div class="cashEmpty">Memuat Smart Cashier…</div></div>
      </section>
      <section id="stockTab" role="tabpanel" aria-labelledby="tabStock" tabindex="-1" hidden>
        <div class="panel">
          <div class="stockTools">
            <label class="srOnly" for="search">Cari menu</label>
            <input id="search" placeholder="Cari menu…" autocomplete="off">
            <label class="srOnly" for="filter">Filter ketersediaan</label>
            <select id="filter"><option value="all">Semua</option><option value="on">Tersedia</option><option value="off">Habis</option></select>
          </div>
          <div id="stockgrid" class="stockgrid"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="proofModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="proofTitle" hidden>
    <div class="modalbox">
      <div class="mh"><b id="proofTitle">Bukti Pembayaran</b><button id="closeProof" class="btn" type="button">Tutup</button></div>
      <img id="proofImg" alt="Bukti pembayaran">
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/kds-assets/v4/tenant-runtime.js" defer></script>
  <script src="/kds-assets/v4/quantity2.js" defer></script>
  <script src="/kds-assets/v4/fast-nav.js" defer></script>
  <script src="/kds-assets/v4/design-runtime.js" defer></script>
  <script src="/kds-assets/v4/app.js" defer></script>
  <script src="/kds-assets/v4/menu-media.js" defer></script>
  <script src="/kds-assets/v4/cashier-required-receipt.js" defer></script>
  <script src="/kds-assets/v4/print-hide.js" defer></script>
</body>
</html>
